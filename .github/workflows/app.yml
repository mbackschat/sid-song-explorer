name: Application
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: application-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Build and software checks / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check docs
      - uses: actions/cache@v4
        id: engine
        with:
          path: build/stereo-gate/output/
          key: raw-chip-linux-v1-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'scripts/experiments/stereo/**', 'scripts/generate-test-sid.ts', 'LICENSE') }}
      - run: pnpm prepare:engine
        if: steps.engine.outputs.cache-hit != 'true'
      - run: pnpm release:check build
        timeout-minutes: 3
      - run: pnpm release:check software
        timeout-minutes: 3
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: |
            dist/
            public/generated/
            build/release/artifact.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-diagnostics
          path: |
            build/release/
            build/stereo-gate/*.log
            build/stereo-gate/*.json
            build/stereo-gate/output/*.json

  browsers:
    name: ${{ matrix.project }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chrome
            os: ubuntu-24.04
            install: chrome
          - project: webkit
            os: macos-26
            install: webkit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: .
      - name: Install browser dependencies
        timeout-minutes: 2
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/release
          pnpm exec playwright install --with-deps ${{ matrix.install }} 2>&1 | tee build/release/browser-install-${{ matrix.project }}.log
      - run: pnpm release:check browser --project ${{ matrix.project }} --shard 1/1
        timeout-minutes: 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-receipts-${{ matrix.project }}
          path: |
            build/release/browser-*.json
            build/release/inventory-*.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-diagnostics-${{ matrix.project }}
          path: |
            build/release/
            test-results/

  publish:
    name: Publish tested app
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [check, browsers]
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: browser-receipts-*
          path: build/release/receipts/
      - run: pnpm release:check coverage --receipts build/release/receipts
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publish-diagnostics
          path: build/release/
